name: fitness_training
description: Fitness Training.

publish_to: 'none' 

version: 2.0.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  auto_route: ^7.8.4 
  spider: ^4.2.2
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.1.0
  dio: ^5.4.1
  flutter_bloc: ^9.0.0
  shared_preferences: ^2.2.2
  equatable: ^2.0.5
  intl: ^0.19.0
  colorize_text_avatar: ^1.0.2
  collection: ^1.18.0
 # responsive_builder: ^0.7.0
  hive: ^2.2.3
  path_provider: ^2.1.2
  flutter_screenutil: ^5.9.0
  flutter_easyloading: ^3.0.5
  get_it: ^8.0.3
  built_value: ^8.9.1
  built_collection: ^5.1.1
  logging: ^1.2.0
  animated_text_kit: ^4.2.2
  video_player: ^2.8.2
  rive: ^0.13.20
  injectable: ^2.3.2
  audioplayers: ^6.1.2
  loading_animations: ^2.2.0
  wakelock_plus: ^1.2.10

dependency_overrides:
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  auto_route_generator: ^7.3.2 
  hive_generator: ^2.0.1
  built_value_generator: ^8.9.1
  injectable_generator: ^2.4.1
  flutter_launcher_icons: ^0.14.3
  analyzer: ^6.11.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pngs/
    - assets/svgs/
    - assets/gif/
    - assets/video/
    - assets/rive/
    - assets/video/lsec.mp4

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart

fonts:
  - family: Inter
    fonts:
      - asset: fonts/Inter-Regular.ttf
      - asset: fonts/Inter-Bold.ttf
      - asset: fonts/Inter-ExtraBold.ttf
      - asset: fonts/Inter-Light.ttf
      - asset: fonts/Inter-ExtraLight.ttf
      - asset: fonts/Inter-Black.ttf
      - asset: fonts/Inter-Medium.ttf
      - asset: fonts/Inter-SemiBold.ttf
      - asset: fonts/Inter-Thin.ttf
  - family: SpaceMono
    fonts:
      - asset: fonts/SpaceMono-Bold.ttf
      - asset: fonts/SpaceMono-BoldItalic.ttf
      - asset: fonts/SpaceMono-Italic.ttf
      - asset: fonts/SpaceMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/pngs/logo.png"

